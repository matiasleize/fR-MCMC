# Capa conda: solo el interprete y lo que no es Python.
# Las dependencias Python viven en pyproject.toml.
#
#   conda env create -f environment.yml
#   conda activate fR-MCMC_v2
#   pip install -e ".[plots]"
#
# El compilador C lo necesitan dos cosas:
#   - classy (se instala desde sdist, compila CLASS)
#   - fr_mcmc/utils/solve_sys_c/libfr_ode.so (make)
name: fR-MCMC_v2
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - compilers
  - make
