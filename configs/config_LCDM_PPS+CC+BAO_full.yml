#Example of a configuration file for the LCDM model.
USE_PPLUS_SHOES: True
USE_PPLUS: False
USE_SN: False
USE_CC: True
USE_BAO: False
USE_BAO_FULL: True
USE_AGN: False
USE_H0: False

MODEL: 'LCDM' #Choose between 'LCDM', 'HS' or 'EXP'
WITNESS_NUM: 1 #Suggestion: (model_number) + (datasets_number) 
FIXED_PARAMS: [0]
LOG_LIKELIHOOD_INDEX: 31 #See docs/parameters_protocol.md
NUM_WALKERS: 32
N_PROCESSES: #Processes to evaluate the walkers in parallel (empty: min(cores, NUM_WALKERS); 1: serial)
CONV_FREQ: 100 #Convergence (N > 100 tau, |Delta tau|/tau < 1%) is checked every CONV_FREQ iterations
MOVES: stretch #Proposal of emcee: stretch (default) or DE (0.8 DEMove + 0.2 DESnookerMove)
MAX_SAMPLES: 100000 #Maximum number of samples
WITNESS_FREQ: 10 #Frequency in which witness is refreshed

#For now only flat priors
M_PRIOR: [-20, -18]
BAO_PARAM_PRIOR: [100, 200]
OMEGA_M_PRIOR: [0.2, 0.4]
B_PRIOR: [0, 1] #Only read if MODEL is 'HS' or 'EXP'
H0_PRIOR: [65, 85]

#For the mean values if needed: 
#They have to have the same length of the number of free params.
GUEST: [-19.352, 0.22, 70]
BOUNDS: [[-25, -18], [0.1, 0.5], [65, 75]]

ALL_ANALYTIC: False #Use Basilakos et al. approximation for all parameters combination.
USE_C: True #Compute H(z) with the C implementation (utils/solve_sys_c)
RD_GRID: False #r_d from the CLASS grid (True) or CLASS at each step (False)
USE_ML: False #HS/ST: use the neural networks inside their training range

#Directory in which output files are stored
OUTPUT_DIR: '/fR-output/LCDM/'

#Other things that are not in use:
#DATA_PATH: './data'
