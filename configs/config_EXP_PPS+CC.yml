#Example of a configuration file for the LCDM model.
USE_PPLUS_SHOES: True
USE_PPLUS: False
USE_SN: False
USE_CC_LEGACY: True
USE_CC: False #CC: 33 puntos con la covarianza de Moresco et al. (2020) (se solapa con CC_LEGACY: usar uno solo)
USE_BAO_LEGACY_1: False
USE_BAO_LEGACY_2: False
USE_DESI_DR2: False #DESI DR2 (se solapa con BAO_LEGACY_1 y BAO_LEGACY_2: usar uno solo)
USE_QSO: False #Quasares de Benetti et al. (2025)
USE_AGN: False
USE_H0: False

MODEL: 'EXP' #Choose between 'LCDM', 'HS' or 'EXP'
WITNESS_NUM: 1 #Suggestion: (model_number) + (datasets_number) 
FIXED_PARAMS: [0]
LOG_LIKELIHOOD_INDEX: 42 #See docs/parameters_protocol.md
NUM_WALKERS: 32
N_PROCESSES: #Processes to evaluate the walkers in parallel (empty: min(cores, NUM_WALKERS); 1: serial)
CONV_FREQ: 100 #Convergence (N > 100 tau, |Delta tau|/tau < 1%) is checked every CONV_FREQ iterations
MOVES: stretch #Proposal of emcee: stretch (default) or DE (0.8 DEMove + 0.2 DESnookerMove)
MAX_SAMPLES: 100000 #Maximum number of samples
WITNESS_FREQ: 10 #Frequency in which witness is refreshed

#For now only flat priors
M_PRIOR: [-20, -18]
BAO_PARAM_PRIOR: [100, 200]
OMEGA_M_PRIOR: [0.2, 0.4]
B_PRIOR: [0, 2] #Only read if MODEL is 'HS' or 'EXP'
H0_PRIOR: [65, 85]
OMEGA_M_ASTRO_PRIOR: False #Prior gaussiano sobre Omega_m
M_ABS_CM_PRIOR: False #Prior de Camarena & Marra sobre M_abs

#For the mean values if needed: 
#They have to have the same length of the number of free params.
#GUEST: [-19.352, 147, 0.22, 70]
#BOUNDS: [[-25, -18], [100, 200], [0.1, 0.5], [65, 75]]

GUEST: [-19.352, 0.3, 0.1, 70]
BOUNDS: [[-21, -18.5], [0.25, 0.4], [0, 1], [65, 75]]

ALL_ANALYTIC: False #Use Basilakos et al. approximation for all parameters combination.
USE_C: True #Compute H(z) with the C implementation (utils/solve_sys_c)
RD_GRID: False #r_d from the CLASS grid (True) or CLASS at each step (False)
RD_FIXED: #r_d (Mpc) directo; vacio: se calcula con CLASS/grilla (tiene prioridad sobre RD_GRID)
WB_FROM_PARAM: False #True: omega_b = bao_param muestreado (BAO_PARAM_PRIOR en unidades de omega_b, grilla valida en [0.019, 0.026])
K_QSO: #parametro k de la lkl de QSO; vacio: marginalizado analiticamente

#Directory in which output files are stored
OUTPUT_DIR: '/fR-output/EXP/'

#Other things that are not in use:
#DATA_PATH: './data'
